    startAutoBattle();
  }
}

function startAutoBattle() {
  if (!state.inBattle) { showToast('先进入战斗再开启自动'); return; }
  state.autoBattle = true;
  showToast('🤖 自动战斗开启 · 按 R 或手动按钮暂停');
  pushLog('info', '🤖 自动战斗已开启');
  updateBattleUI();
  // 立即执行第一回合，不等延时
  autoTurn();
}

function stopAutoBattle() {
  state.autoBattle = false;
  if (state.autoTimer) { clearTimeout(state.autoTimer); state.autoTimer = null; }
  showToast('⏹ 自动战斗暂停');
  updateBattleUI();
}

// 自动战斗回合间延时（给特效留时间，但要够快）
function scheduleAutoTurn(delay = 350) {
  if (state.autoTimer) clearTimeout(state.autoTimer);
  state.autoTimer = setTimeout(() => {
    if (!state.inBattle) return;
    autoTurn();
  }, delay);
}

// 自动战斗入口：决策 → 调用现有 battleAction
function autoTurn() {
  if (!state.autoBattle || !state.inBattle) return;
  const decision = autoDecide();
  if (!decision) {
    stopAutoBattle();
    return;
  }
  pushLog('info', '🤖 ' + decision.reason);

  // continue_turn = 只消耗元器件（额外行动），然后继续决策放什么
  if (decision.action === 'continue_turn') {
    if (decision.compAction) {
      battleAction('component', null, null, decision.compAction);
    }
    setTimeout(() => autoTurn(), 200);
    return;
  }

  // 普通流程：先消耗元器件（额外行动），再放技能/普攻
  if (decision.compAction) {
    battleAction('component', null, null, decision.compAction);
  }
  battleAction(decision.action, decision.skillId);

  // battleAction 内部会触发 enemyTurn → 结束本回合
  // 等它完成副作用后决定下一步：还在战斗就继续，波次衔接等 startBattle 接力，死了就停
  setTimeout(() => {
    if (state.autoBattle && state.inBattle) {
      scheduleAutoTurn();
    } else if (state.autoBattle && !state.inBattle) {
      // 战斗结束但自动还开着 → 等下一场 startBattle 接力
      scheduleAutoTurn(1200);
    }
  }, 900);
}

// ========== 自动战斗决策树 ==========
function autoDecide() {
  const enemy = state.battleState?.enemy;
  if (!enemy || enemy.currentHp <= 0) return null;

  const hpPct = state.hp / state.maxHp;
  const mpPct = state.mp / state.maxMp;
  const isBoss = !!enemy.isBoss;

  const skillBar = (state.skillBar && state.skillBar.length ? state.skillBar : state.learnedSkills)
    .map(id => SKILLS.find(s => s.id === id))
    .filter(Boolean);

  const enemyDebuffed = state.enemyDebuffs && state.enemyDebuffs.turns > 0;

  // ---------- 层 1: 紧急救援 ----------
  // 治疗：内存条（不占回合）> 治疗技能（占回合）
  const healSkill = skillBar.find(s => s.healMul && s.mpCost <= state.mp);
  if (hpPct < 0.25) {
    if ((state.components.ram || 0) > 0) return { action: 'continue_turn', compAction: 'ram', reason: `HP危急，消耗内存条` };
    if (healSkill) return { action: 'skill', skillId: healSkill.id, reason: `HP危急(${Math.floor(hpPct*100)}%)，放 ${healSkill.name}` };
  }

  // 回蓝：电容（不占回合）→ 补完继续决策
  const anyMpSkill = skillBar.find(s => s.mpCost > 0);
  if ((anyMpSkill && state.mp < anyMpSkill.mpCost) || mpPct < 0.15) {
    if ((state.components.capacitor || 0) > 0) {
      return { action: 'continue_turn', compAction: 'capacitor', reason: 'MP不足，消耗电容补蓝' };
    }
  }

  // ---------- 层 2: BOSS 特殊应对 ----------
  if (isBoss && state.bossMechanics) {
    const bm = state.bossMechanics;

    // 幽灵王虚化 → 消耗二极管穿透
    if (bm.evadePhase && (state.components.diode || 0) > 0) {
      return buildComponentAttack('diode', '虚化阶段，二极管穿透');
    }

    // BOSS 充能中 → 留电阻但先给一下暴击增效
    if (bm.chargeCount !== undefined && (state.components.diode || 0) > 0 && (bm.chargeCount + 1) >= 3) {
      // 下回合 BOSS 会放大招，先上二极管，同时消耗电阻挡伤害是 enemyTurn 里自动的
      return buildComponentAttack('diode', 'BOSS即将充能放电，先叠暴击');
    }

    // AI 主神飞升倒计时 → 全力输出（自损也上）
    if (bm.countdownActive) {
      const bestDamage = pickBestDamageSkill(skillBar);
      if (bestDamage) return bestDamage;
      return { action: 'attack', reason: '飞升倒计时！全力输出！' };
    }

    // BOSS 无 debuff → 优先信号干扰
    if (!enemyDebuffed) {
      const jamSkill = skillBar.find(s => s.debuffEnemy && s.mpCost <= state.mp);
      if (jamSkill) return { action: 'skill', skillId: jamSkill.id, reason: `BOSS无debuff，放 ${jamSkill.name}` };
    }
  }

  // ---------- 层 3: 技能选择 ----------
  // 信号干扰（对非BOSS也有用）
  if (!isBoss && !enemyDebuffed) {
    const jamSkill = skillBar.find(s => s.debuffEnemy && s.mpCost <= state.mp);
    if (jamSkill && skillBar.length > 1) {
      // 只在还有其他技能可用时才用干扰，避免浪费回合
      // 但如果 hp 低就不放了，先自救
      if (hpPct > 0.4) return { action: 'skill', skillId: jamSkill.id, reason: `无debuff，放 ${jamSkill.name}` };
    }
  }

  // HP 中等偏低 → 考虑治疗技能
  if (hpPct < 0.4 && healSkill) {
    return { action: 'skill', skillId: healSkill.id, reason: `HP ${Math.floor(hpPct*100)}%，治疗` };
  }

  // 超频一击 / 自损技能：HP > 50% 才用
  if (hpPct > 0.5) {
    const selfDmgSkill = skillBar.find(s => s.selfDmg && s.mpCost <= state.mp);
    if (selfDmgSkill) {
      return buildComponentDamageSkill(selfDmgSkill);
    }
  }

  // 普通伤害技能：按效率选
  const best = pickBestDamageSkill(skillBar);
  if (best) return buildComponentDamageSkill(best);

  // ---------- 层 4: 兜底普攻 ----------
  return buildComponentAttack(null, 'MP不足或无合适技能，普攻');
}

// 选 (伤害倍率 / MP消耗) 效率最高的伤害技能
function pickBestDamageSkill(skillBar) {
  const damageSkills = skillBar.filter(s =>
    s.dmgMul && !s.healMul && !s.selfDmg && !s.debuffEnemy && s.mpCost <= state.mp
  );
  if (damageSkills.length === 0) {
    // 如果没有纯伤害技能，也考虑自损或 debuff 附带伤害的
    const fallback = skillBar.filter(s => s.dmgMul && s.mpCost <= state.mp);
    if (fallback.length === 0) return null;
    return fallback.reduce((a, b) => (a.dmgMul / Math.max(a.mpCost,1) > b.dmgMul / Math.max(b.mpCost,1) ? a : b));
  }
  return damageSkills.reduce((a, b) => (a.dmgMul / Math.max(a.mpCost,1) > b.dmgMul / Math.max(b.mpCost,1) ? a : b));
}

// 组装决策：先消耗元器件，再放技能
function buildComponentDamageSkill(skill) {
  const comps = state.components;
  // 法术技能 → 有晶体管先消耗（伤害 ×1.5）
  if ((comps.transistor || 0) > 0 && state.pendingSpellMul === 1) {
    return { action: 'skill', skillId: skill.id, compAction: 'transistor', reason: `晶体管+${skill.name}` };
  }
  return { action: 'skill', skillId: skill.id, reason: `放 ${skill.name}` };
}

// 组装决策：先消耗元器件，再普攻
function buildComponentAttack(compKey, reason) {
  if (!compKey) return { action: 'attack', reason };
  return { action: 'attack', compAction: compKey, reason };
}

// W 键：智能消耗一个最优元器件（给手动玩家用的一键增效）
function battleActionComponentSmart(forceKey = null) {
  if (!state.inBattle) return;
  const enemy = state.battleState?.enemy;
  if (!enemy) return;

  const comps = state.components;
  const hasTransistor = (comps.transistor || 0) > 0;
  const hasDiode = (comps.diode || 0) > 0;
  const hasChip = (comps.chip || 0) > 0;
  const hasResistor = (comps.resistor || 0) > 0;
  const hasCapacitor = (comps.capacitor || 0) > 0;
  const hasRam = (comps.ram || 0) > 0;

  // 如果指定了强制 key（给 AI 内部用），直接用
  if (forceKey && comps[forceKey] > 0) {
    battleAction('component', null, null, forceKey);
    return;
  }

  // MP 低 → 补蓝
  const mpPct = state.mp / state.maxMp;
  if (mpPct < 0.2 && hasCapacitor) {
    battleAction('component', null, null, 'capacitor');
    return;
  }
  // HP 低 → 补红
  const hpPct = state.hp / state.maxHp;
  if (hpPct < 0.25 && hasRam) {
    battleAction('component', null, null, 'ram');
    return;
  }
  // 有晶体管优先（法术伤害×1.5，泛用性最强）
  if (hasTransistor && state.pendingSpellMul === 1) {
    battleAction('component', null, null, 'transistor');
    return;
  }
  // 有二极管（普攻必暴）
  if (hasDiode && !state.pendingCrit) {
    battleAction('component', null, null, 'diode');
    return;
  }
  // 敌人 HP 高 → 芯片真实伤害
  if (hasChip && enemy.currentHp > enemy.maxHp * 0.3) {
    battleAction('component', null, null, 'chip');
    return;
  }
  // 都没有 → 提示
  showToast('没有可消耗的元器件了');
}

function endBattle(won) {
  const bs = state.battleState, enemy = bs.enemy;
  const rewards = { xp: 0, gold: 0, comps: {}, item: null, lostGold: 0, isFinal: false };
  const rp = state.regionProgress;
  const region = state.currentRegion;
  const isBoss = !!enemy.isBoss;

  if (won) {
    // === 计算奖励 ===
    let xpGain, goldGain;
    if (isBoss && enemy.bossRewards) {
      // Boss 奖励：额外金币 + 保底芯片和 PCB
      xpGain = enemy.maxHp / 3;
      goldGain = enemy.bossRewards.gold;
      const luckyUsed = state.luckyNextBattle;
      if (luckyUsed) { xpGain *= 2; goldGain *= 2; state.luckyNextBattle = false; }
      state.gold += Math.floor(goldGain); state.stats.goldEarned += Math.floor(goldGain);
      gainXp(Math.floor(xpGain)); state.stats.battlesWon++;
      hookQuestProgress('kill_enemy', 1);
      playSFX('death');
      rewards.xp = Math.floor(xpGain); rewards.gold = Math.floor(goldGain); rewards.lucky = luckyUsed;
      // Boss 掉落：保底芯片×2-4 + PCB×1-2
      const br = enemy.bossRewards;
      for (const [comp, range] of Object.entries(br)) {
        if (comp === 'gold') continue;
        const qty = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
        state.components[comp] = (state.components[comp] || 0) + qty;
        rewards.comps[comp] = qty;
      }
      // Boss 专属装备掉落
      const bossCfg = REGION_BOSSES[enemy.regionId];
      if (bossCfg && bossCfg.equipDrop) {
        const ed = bossCfg.equipDrop;
        const chances = Array.isArray(ed.chance) ? ed.chance : ed.items.map(() => ed.chance);
        rewards.equipDrops = [];
        ed.items.forEach((itemId, i) => {
          const c = chances[i] !== undefined ? chances[i] : 0.5;
          if (Math.random() < c) {
            state.bag[itemId] = (state.bag[itemId] || 0) + 1;
            rewards.equipDrops.push(itemId);
            pushLog('crit', `🎁 BOSS 专属掉落! ${ITEMS[itemId].name}`);
          }
        });
      }
      rewards.isFinal = true;
    } else {
      // 普通波次：沿用旧奖励
      let xpGain2 = enemy.xp, goldGain2 = Math.floor(enemy.gold[0] + Math.random() * (enemy.gold[1] - enemy.gold[0]));
      if (state.xpBonus) xpGain2 = Math.floor(xpGain2 * (1 + state.xpBonus));
      if (state.goldBonus) goldGain2 = Math.floor(goldGain2 * (1 + state.goldBonus));
      const luckyUsed = state.luckyNextBattle;
      if (luckyUsed) { xpGain2 *= 2; goldGain2 *= 2; state.luckyNextBattle = false; }
      state.gold += goldGain2; state.stats.goldEarned += goldGain2;
      gainXp(xpGain2); state.stats.battlesWon++;
      hookQuestProgress('kill_enemy', 1);
      playSFX('coin');
      rewards.xp = xpGain2; rewards.gold = goldGain2; rewards.lucky = luckyUsed;
      // 元器件掉落
      const drops = dropComponents(enemy);
      for (const [comp, qty] of Object.entries(drops)) {
        state.components[comp] = (state.components[comp] || 0) + qty;
        rewards.comps[comp] = qty;
      }
      // 随机掉落消耗品
      if (Math.random() < 0.25) {
        const drops2 = ['heal_pack','mp_pack','big_heal'];
        const drop = drops2[Math.floor(Math.random() * drops2.length)];
        state.bag[drop] = (state.bag[drop] || 0) + 1;
        rewards.item = drop;
      }
      // 波次间恢复：普通波 30% HP/MP，Boss 前一波 50% HP/MP
      const isPreBoss = (rp.waveIdx + 1) === rp.totalWaves;
      const healPct = isPreBoss ? 0.5 : 0.3;
      const healHp = Math.floor(state.maxHp * healPct);
      const healMp = Math.floor(state.maxMp * healPct);
      state.hp = Math.min(state.maxHp, state.hp + healHp);
      state.mp = Math.min(state.maxMp, state.mp + healMp);
    }

    // === 波次推进 ===
    if (isBoss) {
      // Boss 通关 → 区域全清，重置进度，关战斗，弹结算
      state.inBattle = false; state.battleState = null;
      state.regionProgress = null; state.bossMechanics = null;
      updateHeader(); saveGame();
      showSettleModal(true, enemy, rewards, region ? region.name : '');
    } else {
      // 普通波 → 波次计数 +1 → 下一波 or 进 Boss（无事件，纯打怪链）
      rp.waveIdx++;
      state.inBattle = false; state.battleState = null;
      state.bossMechanics = null;
      updateHeader(); saveGame();
      setTimeout(() => launchNextWave(region), 600);
    }
  } else {
    // === 战败 ===
    const lost = Math.floor(state.gold * 0.2);
    if (lost > 0) { state.gold -= lost; rewards.lostGold = lost; }
    state.xp = Math.floor(state.xp * 0.3);  // 战败重置 30% 修为（比原来更温和）
    state.stats.battlesLost++;
    // 战败后差异化恢复
    if (isBoss) {
      // Boss 战败：回到区域起点，HP 恢复 50%
      state.hp = Math.floor(state.maxHp * 0.5); state.mp = Math.floor(state.maxMp * 0.5);
      state.regionProgress.waveIdx = 0;  // 波次重置
      state.regionProgress.isBossPhase = false;
    } else {
      // 普通战败：HP 恢复 30%，波次重置
      state.hp = Math.floor(state.maxHp * 0.3); state.mp = Math.floor(state.maxMp * 0.3);
      state.regionProgress.waveIdx = 0;
    }
    state.inBattle = false; state.battleState = null;
    state.bossMechanics = null;
    updateHeader(); saveGame();
    showSettleModal(false, enemy, rewards, region ? region.name : '');
  }
}

// 修炼事件选择后的处理
function handleCultivateEvent(action, data) {
  switch (action) {
    case 'cultivate_gain_xp': gainXp(data.amount || 100); break;
    case 'cultivate_mp': state.mp = Math.min(state.maxMp, state.mp + Math.floor(state.maxMp * (data.mpPercent || 0.2))); break;
    case 'cultivate_comps': {
      const count = data.count || 1;
      const range = data.range || 1;
      const keys = Object.keys(COMPONENTS);
      for (let i = 0; i < count; i++) {
        const k = keys[Math.floor(Math.random() * keys.length)];
        const qty = 1 + Math.floor(Math.random() * range);
        state.components[k] = (state.components[k] || 0) + qty;
      }
      break;
    }
    case 'cultivate_buy': {
      if (state.gold < data.cost) { showToast('灵石不足！'); return; }
      state.gold -= data.cost;
      state.bag[data.item] = (state.bag[data.item] || 0) + 1;
      break;
    }
    case 'cultivate_pass': break;
  }
  updateHeader(); saveGame();
}

function renderCraft(contentEl) {
  const content = contentEl || $('craftContent');
  // 元器件概览（紧凑带tooltip）
  const compsHtml = Object.keys(COMPONENTS).map(id => {

    const qty = state.components[id] || 0;

      <span class="comp-emoji">${c.emoji}</span>
      <div class="comp-name">${c.name.split(' ')[0]}</div>
      <div class="comp-qty" style="color:${qty>0?'var(--gold)':'#333'}">${qty}</div>
      <span class="tip" data-tip="${c.desc}" style="position:absolute;top:6px;right:6px">?</span>
    </div>`;
  }).join('');

  // 按分类渲染2列网格
  let allRecipesHtml = '';
  for (const [groupName, recipeIds] of Object.entries(RECIPE_GROUPS)) {
    const groupRecipes = recipeIds.map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
    allRecipesHtml += `<h3 style="margin-top:14px;margin-bottom:6px">${groupName}</h3>`;
    allRecipesHtml += '<div class="recipe-grid">';
    groupRecipes.forEach(r => {
      const item = ITEMS[r.result.itemId];
      const partsHtml = Object.entries(r.parts).map(([comp, need]) => {
        const have = state.components[comp] || 0;
        const enough = have >= need;
        const diff = need - have;
        const text = enough ? `${COMPONENTS[comp].emoji}${have}` : `${COMPONENTS[comp].emoji}缺${diff}`;
        return `<span class="${enough?'enough':'lack'}">${text}</span>`;
      }).join('');
      const allEnough = Object.entries(r.parts).every(([c,n]) => (state.components[c]||0) >= n);
      const rarityClass = item.rarity ? `art-${item.rarity} glow-${item.rarity}` : 'art-common glow-common';
      const rarityBadge = item.rarity === 'legend' ? '★传说★' : item.rarity === 'epic' ? '史诗' : item.rarity === 'rare' ? '稀有' : '普通';
      allRecipesHtml += `
        <div class="weapon-art ${rarityClass}" style="margin-bottom:10px;${allEnough?'':'opacity:.75'}">
          <div class="weapon-art-rarity rarity-badge-${item.rarity || 'common'}">${rarityBadge}</div>
          <div class="weapon-art-emoji">${item.emoji}</div>
          <div class="weapon-art-name">${item.name}</div>
          <div class="weapon-art-desc">${item.desc}</div>
          <div class="recipe-parts-inline" style="justify-content:center">${partsHtml}</div>
          <button class="btn ${allEnough?'btn-primary':''}" style="padding:5px 12px;font-size:11px;margin-top:4px" onclick="craftRecipe('${r.id}')" ${allEnough?'':'disabled'}>
            ${allEnough ? '✨ 合成' : '🔒 材料不足'}
          </button>
        </div>
      `;
    });
    allRecipesHtml += '</div>';
  }

  // 空元器件提示
  const hasAnyComp = Object.values(state.components).some(v => v > 0);

  // ===== 强化 Tab 内容 =====
  const enhanceSlots = ['weapon', 'armor', 'accessory'];
  const enhanceSlotNames = { weapon: '⚔️ 武器', armor: '🛡️ 护甲', accessory: '💍 饰品' };
  let enhanceHtml = '<div style="margin-top:8px">';
  for (const slot of enhanceSlots) {
    const itemId = state.equipped[slot];
    const enhanceLv = state.equipEnhance[slot] || 0;
    const enhanceMax = 10;
    const item = itemId ? ITEMS[itemId] : null;
    if (!item) {
      enhanceHtml += `<div class="recipe-card-compact" style="opacity:.5">
        <div class="recipe-head"><span class="emoji">📦</span><span class="name">${enhanceSlotNames[slot]} · 未装备</span></div>
      </div>`;
      continue;
    }
    // 强化消耗：随等级递增
    const costGold = 50 * (enhanceLv + 1) * (item.rarity === 'legend' ? 5 : item.rarity === 'epic' ? 3 : item.rarity === 'rare' ? 2 : 1);
    const costPcb = Math.min(3, Math.floor(enhanceLv / 2) + 1);
    const costChip = enhanceLv >= 3 ? Math.min(2, Math.floor((enhanceLv - 2) / 2) + 1) : 0;
    const enhanceMul = 1 + enhanceLv * 0.12;
    const nextMul = enhanceLv < enhanceMax ? 1 + (enhanceLv + 1) * 0.12 : null;
    const canEnhance = enhanceLv < enhanceMax && state.gold >= costGold && (state.components.pcb || 0) >= costPcb && (state.components.chip || 0) >= costChip;
    enhanceHtml += `
      <div class="recipe-card-compact">
        <div class="recipe-head">
          <span class="emoji">${item.emoji}</span>
          <span class="name">${item.name} ${enhanceLv > 0 ? `<span style="color:#FFD700;font-weight:800">+${enhanceLv}</span>` : ''}</span>
          <span style="margin-left:auto;font-size:10px;color:var(--text-dim)">${enhanceLv}/${enhanceMax}</span>
        </div>
        <div class="recipe-desc-inline">${item.desc.replace(/\n/g, ' | ')}</div>
        <div class="recipe-desc-inline" style="color:var(--gold)">当前强化率 ×${enhanceMul.toFixed(2)}${nextMul ? ` → ×${nextMul.toFixed(2)}` : '（已满级）'}</div>
        ${enhanceLv < enhanceMax ? `
          <div class="recipe-parts-inline">
            <span class="${state.gold>=costGold?'enough':'lack'}">💰${costGold}</span>
            <span class="${(state.components.pcb||0)>=costPcb?'enough':'lack'}">🟫PCB×${costPcb}</span>
            ${costChip > 0 ? `<span class="${(state.components.chip||0)>=costChip?'enough':'lack'}">🔵芯片×${costChip}</span>` : ''}
          </div>
          <div class="recipe-btn-wrap">
            <button class="btn ${canEnhance?'btn-primary':'disabled-btn'}" style="padding:5px 10px;font-size:11px;width:100%" onclick="tryEnhance('${slot}')" ${canEnhance?'':'disabled'}>
              ⚒️ 强化 → +${enhanceLv+1}
            </button>
          </div>` : `
          <div class="recipe-desc-inline" style="color:#FFD700;text-align:center;font-weight:700">✨ 已达最高强化 ✨</div>`}
      </div>`;
  }
  enhanceHtml += '</div>';

  content.innerHTML = `
    ${'<!--TAB_PLACEHOLDER-->'}
    <div class="craft-header">
      <h3>🔩 仓库库存</h3>
      <span class="tip" data-tip="去🗺️地图打怪，拆解敌人就能获得元器件！">?</span>
    </div>
    ${hasAnyComp ? `<div class="comp-grid" style="grid-template-columns:repeat(5,1fr)">${compsHtml}</div>` : `
      <div class="empty-guide">
        <div class="hint-title">😶 暂无元器件</div>
        <div class="hint-desc">去地图打怪，拆解敌人就能获得电阻、电容等电子零件</div>
      </div>
    `}
    ${allRecipesHtml}
    ${enhanceHtml}
  `;
}

// ========== 装备强化 ==========
function tryEnhance(slot) {
  const itemId = state.equipped[slot];
  if (!itemId) { showToast('该槽位未装备任何东西'); return; }
  const item = ITEMS[itemId];
  const lv = state.equipEnhance[slot] || 0;
  if (lv >= 10) { showToast('已达最高强化 +10'); return; }

  // 消耗
  const costGold = 50 * (lv + 1) * (item.rarity === 'legend' ? 5 : item.rarity === 'epic' ? 3 : item.rarity === 'rare' ? 2 : 1);
  const costPcb = Math.min(3, Math.floor(lv / 2) + 1);
  const costChip = lv >= 3 ? Math.min(2, Math.floor((lv - 2) / 2) + 1) : 0;

  if (state.gold < costGold) { showToast(`灵石不足，需要 ${costGold}`); return; }
  if ((state.components.pcb || 0) < costPcb) { showToast(`PCB板不足`); return; }
  if ((state.components.chip || 0) < costChip) { showToast(`芯片不足`); return; }

  // 扣材料
  state.gold -= costGold;
  state.components.pcb -= costPcb;
  if (costChip > 0) state.components.chip -= costChip;

  // 基础成功率 +10 到 +100%
  const successRate = Math.min(1, 1.0 - lv * 0.05);  // +0 时100%, +10时50%
  const succeed = Math.random() < successRate;

  if (succeed) {
    state.equipEnhance[slot] = lv + 1;
    showToast(`✨ ${item.name} 强化成功! +${lv+1} → +${lv+2}`);
    showDamageFloat('+' + (lv+2) + '✨', 'heal', 'player');
    playSFX('skill');
    recalcStats();
  } else {
    showToast(`💥 强化失败...成功率 ${Math.floor(successRate*100)}%`);
    playSFX('warn');
  }
  renderCraft();
  renderProfile();
  updateBattleUI();
}

function craftRecipe(recipeId) {
  const r = RECIPES.find(x => x.id === recipeId);
  if (!r) return;
  for (const [comp, need] of Object.entries(r.parts)) {
    if ((state.components[comp] || 0) < need) { showToast('材料不足!'); return; }
  }
  for (const [comp, need] of Object.entries(r.parts)) {
    state.components[comp] -= need;
    if (state.components[comp] <= 0) delete state.components[comp];
  }
  state.bag[r.result.itemId] = (state.bag[r.result.itemId] || 0) + r.result.qty;
  hookQuestProgress('craft', 1);  // 任务挂钩
  playSFX('craft');
  showToast(`>> 合成成功! +${ITEMS[r.result.itemId].name}`);
  saveGame(); renderCraft();
}

// ========== 物品效果 ==========
function applyItemEffect(item) {
  if (item.healPercent) {
    const heal = Math.floor(state.maxHp * item.healPercent);
    state.hp = Math.min(state.maxHp, state.hp + heal);
    showToast(`+${heal} HP`);
  }
  if (item.mpPercent) {
    const mp = Math.floor(state.maxMp * item.mpPercent);
    state.mp = Math.min(state.maxMp, state.mp + mp);
    showToast(`+${mp} MP`);
  }
  if (item.lucky) { state.luckyNextBattle = true; showToast('>> 下一场双倍奖励!'); }
}

function tryEquip(itemId) {
  const item = ITEMS[itemId];
  if (!item) return;
  const slot = item.type;
  if (['weapon','armor','accessory'].includes(slot)) {
    const old = state.equipped[slot];
    state.equipped[slot] = itemId;
    if (old) state.bag[old] = (state.bag[old] || 0) + 1;
    delete state.bag[itemId];
    recalcStats();
    showToast('>> 已装备 ' + item.name);
    saveGame(); renderBag(); updateHeader();
  }
}

function useBagItem(itemId) {
  if (state.inBattle) return;
  state.bag[itemId]--;
  applyItemEffect(ITEMS[itemId]);
  saveGame(); renderBag(); updateHeader();
}

function sellItem(itemId) {
  const item = ITEMS[itemId];
  const price = Math.floor(item.price * 0.3);
  state.gold += price; state.bag[itemId]--;
  if (state.bag[itemId] <= 0) delete state.bag[itemId];
  showToast(`卖出 ${item.name} +${price} 灵石`);
  saveGame(); renderBag(); updateHeader();
}

  html += `</div><div style="font-size:10px;color:#8B9CB8">点击下方法术卡片的 ⭐ 按钮添加到快捷栏</div></div>`;

  // ===== 已学法术 =====
  html += `<h3 style="font-size:11px;color:#8B9CB8;margin-bottom:6px">✨ 已学法术 (${state.learnedSkills.length})</h3>`;
  html += '<div class="skill-grid">';
  html += state.learnedSkills.map(sid => {
    const sk = SKILLS.find(s => s.id === sid);
    const inBar = sb.includes(sid);
    const toggle = inBar ? `removeFromSkillBar('${sid}')` : `addToSkillBar('${sid}')`;
    const starStyle = inBar ? 'color:var(--gold)' : 'color:#666';
    return `<div class="skill-card ${inBar?'skill-in-bar':''}" style="${inBar?'border-color:var(--gold);background:rgba(250,173,20,0.08)':''}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="skill-name">${sk.emoji||'✨'} ${sk.name}</div>
        <button onclick="${toggle}" style="background:none;border:none;font-size:16px;cursor:pointer;${starStyle}" title="${inBar?'从快捷栏移除':'加入快捷栏'}">${inBar?'★':'☆'}</button>
      </div>
      <div class="skill-info" style="font-size:10px;color:#8B9CB8;margin-top:4px">${sk.desc}</div>
      <div class="skill-cost" style="font-size:10px;margin-top:4px">消耗: ${sk.mpCost}A${sk.dmgMul ? ` | 伤害×${sk.dmgMul}` : ''}${sk.healMul ? ` | 回血×${sk.healMul}` : ''}</div>
    </div>`;
  }).join('');
  html += '</div>';

  // ===== 未解锁法术 =====
  const locked = SKILLS.filter(s => !state.learnedSkills.includes(s.id));
  if (locked.length) {
    const realmNames = ['炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫','飞升'];
    html += `<h3 style="font-size:11px;color:#8B9CB8;margin-top:14px;margin-bottom:6px">🔒 未解锁法术</h3><div class="skill-grid">`;
    locked.forEach(sk => {
      html += `<div class="skill-card locked">
        <div class="skill-name" style="color:#666">▸ ${sk.name}</div>
        <div class="skill-info" style="font-size:10px">需要境界: ${realmNames[sk.unlockRealm]}</div>
      </div>`;
    });
    html += '</div>';
  }
  list.innerHTML = html;
}

// 快捷栏配置函数
function addToSkillBar(sid) {
  if (state.skillBar.includes(sid)) return;
  if (state.skillBar.length >= 4) { showToast('快捷栏最多 4 个'); return; }
  state.skillBar.push(sid);
  playSFX('click');
  saveGame(); renderSkills();

}

function removeFromSkillBar(sid) {
  state.skillBar = state.skillBar.filter(s => s !== sid);
  playSFX('click');
  saveGame(); renderSkills();
  if (state.inBattle) renderBattlePanel();
}

let meditationTimer = null;
let meditationEventCounter = 0;  // 闭关中的事件计数器
function cultivateOnce() {
  gainXp(5 + Math.floor(state.atk * 0.5));
  state.mp = Math.min(state.maxMp, state.mp + 2);
  updateHeader(); saveGame();
  // 手动修炼有 5% 概率触发奇遇事件
  if (Math.random() < 0.05) triggerCultivateEvent();
}

function startMeditation() {
  if (meditationTimer) { showToast('已在闭关中'); return; }
  showToast('>> 开始闭关');
  playSFX('heal');
  // 存离线闭关标记
  localStorage.setItem('xiuxian_cultivate_start', Date.now().toString());
  localStorage.setItem('xiuxian_cultivate_wasFull', (state.hp >= state.maxHp && state.mp >= state.maxMp).toString());
  meditationTimer = setInterval(tickMeditation, 2000);
  tickMeditation(); // 立刻执行一次
  renderCultivate(); // 刷新按钮状态
}

function stopMeditation() {
  if (!meditationTimer) return;
  clearInterval(meditationTimer);
  meditationTimer = null;
  // 清除离线闭关标记（不存了，因为停止后就是手动结束）
  localStorage.removeItem('xiuxian_cultivate_start');
  localStorage.removeItem('xiuxian_cultivate_wasFull');
  showToast('>> 闭关结束');
  playSFX('click');
  renderCultivate();
}

function tickMeditation() {
  if (!meditationTimer) return;
  const isFull = state.hp >= state.maxHp && state.mp >= state.maxMp;
  // 实时更新离线标记状态
  localStorage.setItem('xiuxian_cultivate_wasFull', isFull.toString());
  if (isFull) {
    // 满状态：快速积累修为
    gainXp(10);
    state.mp = Math.min(state.maxMp, state.mp + 5);
  } else {
    // 不满状态：恢复 + 少量经验（让玩家感知到在修仙）
    state.hp = Math.min(state.maxHp, state.hp + Math.floor(state.maxHp * 0.05));
    state.mp = Math.min(state.maxMp, state.mp + Math.floor(state.maxMp * 0.1));
    gainXp(2);  // 不满也给经验！修复了之前不加经验的问题
  }
  updateHeader();
  // 闭关奇遇：每 15 秒（约 7-8 次 tick）有 20% 概率触发
  meditationEventCounter++;
  if (meditationEventCounter >= 8) {
    meditationEventCounter = 0;
    if (Math.random() < 0.2) triggerCultivateEvent();
  }
  // 如果修炼面板开着，更新状态文字
  const statusEl = $('meditationStatus');
  if (statusEl) {
    const mode = isFull ? '修炼中 (+10Hz / +5MP)' : '恢复中 (+5%HP / +10%MP / +2Hz)';
    statusEl.textContent = '>> ' + mode;
  }
  saveGame();
}

// ========== 事件系统 ==========
function triggerEvent() {
  const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  showModal(ev.title, ev.ascii, ev.desc, ev.choices);
}

function showModal(title, ascii, desc, choices) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">!! ${title} !!</div>
      <div class="modal-ascii">${ascii || ''}</div>
      <p>${desc}</p>
      <div class="modal-actions">
        ${choices.map((c,i) => `<button class="btn btn-info" onclick="handleEvent(${i})">${c.text}</button>`).join('')}
      </div>
    </div>
  `;
  overlay.id = 'eventModal'; document.body.appendChild(overlay);
  window._currentEvent = choices;
}

function handleEvent(choiceIdx) {
  const choices = window._currentEvent, choice = choices[choiceIdx];
  $('eventModal').remove(); window._currentEvent = null;
  const a = choice.action;
  if (a === 'leave') { showToast('离开'); }
  else if (a === 'get_item') {
    choice.items.forEach(id => state.bag[id] = (state.bag[id]||0)+1);
    state.gold += choice.gold || 0;
    if (choice.components) {
      for (const [c, rng] of Object.entries(choice.components)) {
        const n = Math.floor(Math.random()*(rng[1]-rng[0]+1))+rng[0];
        if (n>0) state.components[c] = (state.components[c]||0)+n;
      }
    }
    showToast('>> 获得物品和元器件!');
  }
  else if (a === 'get_components') {
    let msg = '';
    for (const [c, rng] of Object.entries(choice.comps)) {
      const n = Math.floor(Math.random()*(rng[1]-rng[0]+1))+rng[0];
      if (n>0) { state.components[c] = (state.components[c]||0)+n; msg += COMPONENTS[c].emoji + n + ' '; }
    }
    showToast('>> 拆解获得: ' + msg);
  }
  else if (a === 'xp_event') { gainXp(choice.xpGain); showToast(`>> +${choice.xpGain} 修为`); }
  else if (a === 'heal_event') { state.hp = state.maxHp; state.mp = state.maxMp; showToast('>> 完全恢复!'); }
  else if (a === 'damage_event') { state.hp = Math.max(1, Math.floor(state.hp * (1 - choice.damagePercent))); showToast('>> 受到伤害'); }
  else if (a === 'flee_event') { state.hp = Math.max(1, Math.floor(state.hp * (1 - choice.hpCost))); showToast('成功逃离'); }
  else if (a === 'cultivate_event') { for (let i=0;i<choice.xpMul;i++) gainXp(20); showToast('>> 修为大增!'); }
  else if (a === 'buy_event') {
    if (state.gold >= choice.cost) { state.gold -= choice.cost; state.bag[choice.item] = (state.bag[choice.item]||0)+1; showToast('购买成功'); }
    else showToast('灵石不足');
  }
  else if (a === 'battle_event' && state.currentRegion) startBattle(state.currentRegion, choice.enemyScale);
  // === 波次间事件处理 ===
  else if (a === 'wave_buy') {
    if (state.gold >= choice.cost) { state.gold -= choice.cost; state.bag[choice.item] = (state.bag[choice.item]||0)+1; showToast('购买成功'); }
    else showToast('灵石不足');
    handleWaveEventPost();
  }
  else if (a === 'wave_comps') {
    let msg = '';
    for (const [c, rng] of Object.entries(choice.comps)) {
      const n = Math.floor(Math.random()*(rng[1]-rng[0]+1))+rng[0];
      if (n>0) { state.components[c] = (state.components[c]||0)+n; msg += COMPONENTS[c].emoji + n + ' '; }
    }
    showToast('>> 拆解获得: ' + msg);
    handleWaveEventPost();
  }
  else if (a === 'wave_heal') {
    const heal = Math.floor(state.maxHp * choice.hpPercent);
    state.hp = Math.min(state.maxHp, state.hp + heal);
    showToast(`>> 恢复 ${heal} HP`);
    handleWaveEventPost();
  }
  else if (a === 'wave_leave') { handleWaveEventPost(); }
  // === 修炼奇遇事件处理 ===
  else if (a.startsWith('cultivate_')) {
    handleCultivateEvent(a, choice);
  }
  updateHeader(); saveGame();
}

// ========== 初始化 ==========
function init() {
  if (!loadGame()) {
    recalcStats();
    state.hp = state.maxHp; state.mp = state.maxMp;
    state.components = { resistor: 5, capacitor: 3 };
    state.bag = { heal_pack: 2, mp_pack: 2 };
    state.gold = 150;
    initQuests();
    showWelcomeModal();
  } else {
    recalcStats();
    if (!state.quests || typeof state.quests !== 'object') state.quests = {};
    // 每日重置检查
    resetDailyQuestsIfNeeded();
    // 确保所有 QUEST 都有状态条目（旧存档兼容）
    QUESTS.forEach(q => { if (state.quests[q.id] === undefined) state.quests[q.id] = { progress: 0, claimed: false }; });
    // 离线闭关结算
    const offlineStart = parseInt(localStorage.getItem('xiuxian_cultivate_start') || '0');
    if (offlineStart > 0) {
      const now = Date.now();
      const elapsedMs = Math.min(now - offlineStart, 24 * 60 * 60 * 1000);
      const ticks = Math.floor(elapsedMs / 2000);
      if (ticks > 0) {
        const wasFull = JSON.parse(localStorage.getItem('xiuxian_cultivate_wasFull') || 'false');
        if (wasFull) {
          for (let i = 0; i < ticks; i++) { gainXp(10); state.mp = Math.min(state.maxMp, state.mp + 5); }
        } else {
          for (let i = 0; i < ticks; i++) {
            state.hp = Math.min(state.maxHp, state.hp + Math.floor(state.maxHp * 0.05));
            state.mp = Math.min(state.maxMp, state.mp + Math.floor(state.maxMp * 0.1));
            gainXp(2);
          }
        }
        const elapsedMin = Math.floor(elapsedMs / 60000);
        showToast(`>> 闭关恢复 ${elapsedMin} 分钟，修为大增！`);
      }
      localStorage.removeItem('xiuxian_cultivate_start');
      localStorage.removeItem('xiuxian_cultivate_wasFull');
    }
    showToast('>> 欢迎回来, ' + getRealmName());
  }
  updateHeader(); saveGame();
  renderRegions();
}

// ========== 任务系统 ==========
function initQuests() {
  // 新存档：初始化所有任务进度
  QUESTS.forEach(q => { state.quests[q.id] = { progress: 0, claimed: false }; });
  state.lastDailyReset = new Date().toDateString();
}

function resetDailyQuestsIfNeeded() {
  const today = new Date().toDateString();
  if (state.lastDailyReset !== today) {
    QUESTS.forEach(q => {
      if (q.type === 'daily') state.quests[q.id] = { progress: 0, claimed: false };
    });
    state.lastDailyReset = today;
  }
}

function hookQuestProgress(kind, amount = 1) {
  QUESTS.forEach(q => {
    if (q.target.kind !== kind) return;
    if (state.quests[q.id]?.claimed) return; // 已领取就不再计数
    if (q.unlock && q.unlock.realmIdx != null && state.realmIdx < q.unlock.realmIdx) return;
    // 累计类（成就）和循环类都直接加进度
    state.quests[q.id] = state.quests[q.id] || { progress: 0, claimed: false };
    state.quests[q.id].progress += amount;
    // 达成时弹提示
    if (state.quests[q.id].progress >= q.target.count && !state.quests[q.id]._notified) {
      state.quests[q.id]._notified = true;
      showToast('🎯 任务完成: ' + q.title + ' (去📋领取奖励)');
      playSFX('levelup');
    }
  });
  updateQuestBadge();
  saveGame();
}

function claimQuest(qid) {
  const q = QUESTS.find(q => q.id === qid); if (!q) return;
  const qs = state.quests[qid]; if (!qs) return;
  if (qs.claimed) { showToast('已领取过'); return; }
  if (qs.progress < q.target.count) { showToast('进度未达成'); return; }
  // 发放奖励
  const r = q.reward;
  if (r.xp) gainXp(r.xp);
  if (r.gold) { state.gold += r.gold; state.stats.goldEarned += r.gold; }
  if (r.components) Object.entries(r.components).forEach(([k,v]) => { state.components[k] = (state.components[k]||0) + v; });
  qs.claimed = true;
  qs._notified = true;
  showToast('🎁 领取: ' + q.title);
  playSFX('coin');
  updateQuestBadge();
  updateHeader(); saveGame();
  renderQuests();
}

function updateQuestBadge() {
  const btn = $('questNavBtn');
  if (!btn) return;
  if (!state.quests) state.quests = {};
  const canClaim = QUESTS.some(q => {
    const qs = state.quests[q.id];
    return qs && !qs.claimed && qs.progress >= q.target.count;
  });
  btn.innerHTML = canClaim ? '📋 <span style="background:var(--danger);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;display:inline-block;min-width:14px;text-align:center">!</span>' : '📋';
}

function renderQuests() {
  const c = $('questContent'); if (!c) return;
  // 按类型分组
  const groups = { main:'🔴 主线任务', daily:'🟡 每日任务', achievement:'🏆 成就' };
  let html = '';
  Object.entries(groups).forEach(([type, label]) => {
    const quests = QUESTS.filter(q => q.type === type);
    if (!quests.length) return;
    html += `<h3 style="margin-top:10px;margin-bottom:6px;color:var(--blue-400)">${label}</h3>`;
    quests.forEach(q => {
      const qs = state.quests[q.id] || { progress: 0, claimed: false };
      const progress = Math.min(qs.progress, q.target.count);
      const percent = Math.floor(progress / q.target.count * 100);
      const canClaim = !qs.claimed && qs.progress >= q.target.count;
      const locked = q.unlock && q.unlock.realmIdx != null && state.realmIdx < q.unlock.realmIdx;
      const rewardStr = Object.entries(q.reward).map(([k,v]) => {
        if (k === 'xp') return `+${v}Hz`;
        if (k === 'gold') return `+💰${v}`;
        if (k === 'components') return Object.entries(v).map(([ck,cv]) => `+${cv}×${ck}`).join(' ');
        return k;
      }).join(' ');
      html += `
        <div style="border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:6px;${locked?'opacity:0.5':''}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:600;font-size:12px">${locked?'🔒 ':''}${q.title}</div>
              <div style="color:#8B9CB8;font-size:10px">${q.desc}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:11px;color:var(--gold)">奖励: ${rewardStr}</div>
              ${qs.claimed
                ? '<span style="font-size:10px;color:var(--success)">✓ 已领取</span>'
                : canClaim
                  ? `<button class="btn btn-success" style="padding:4px 10px;font-size:10px" onclick="claimQuest('${q.id}')">领取</button>`
                  : `<span style="font-size:10px;color:#8B9CB8">${progress}/${q.target.count}</span>`
              }
            </div>
          </div>
          <div class="stat-bar" style="margin-top:6px;height:6px"><div class="stat-fill fill-xp" style="width:${percent}%"></div></div>
        </div>
      `;
    });
  });
  if (!html) html = '<div class="empty-hint">暂无任务</div>';
  c.innerHTML = html;
}

init();
setInterval(saveGame, 30000);
</script>
</body>
</html>
